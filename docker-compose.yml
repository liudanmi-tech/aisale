services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://aigc:aigc@db:5432/aigc
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SEEDANCE_MODE: ${SEEDANCE_MODE:-mock}
      SEEDANCE_API_KEY: ${SEEDANCE_API_KEY:-}
      SEEDANCE_MODEL: ${SEEDANCE_MODEL:-}
      TIKTOK_MODE: ${TIKTOK_MODE:-mock}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_ADVERTISER_ID: ${TIKTOK_ADVERTISER_ID:-}
    depends_on: [db]
  db:
    image: postgres:16
    environment: { POSTGRES_USER: aigc, POSTGRES_PASSWORD: aigc, POSTGRES_DB: aigc }
    volumes: ["pg:/var/lib/postgresql/data"]
volumes:
  pg: {}
